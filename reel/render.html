<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Render — Punta Ballena, memorias del territorio</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<!-- Página de exportación: solo el cuadro 1080×1920, sin controles. -->
<canvas id="frame"></canvas>
<script src="src/config.js"></script>
<script src="src/lib.js"></script>
<script src="src/figures.js"></script>
<script src="src/scenes.js"></script>
<script src="src/reel.js"></script>
<script>
  window.reelReady = (async () => {
    const reel = new PB.Reel(document.getElementById('frame'), window.REEL_CONFIG);
    await reel.load();
    window.reel = reel;
    return { warnings: reel.warnings, logo: !!reel.logo };
  })();
  // Devuelve el cuadro en t como PNG (base64, sin prefijo).
  window.frameAt = async (t, type = 'image/png', q) => {
    window.reel.render(t);
    const blob = await new Promise((r) => document.getElementById('frame').toBlob(r, type, q));
    const buf = new Uint8Array(await blob.arrayBuffer());
    let s = '';
    for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    return btoa(s);
  };
</script>
</body>
</html>
